[package]
name = "seer"
version = "0.1.0"
edition = "2024"
authors = ["Richard Keelan"]
description = "A fast, single-window image viewer for Windows that agents can drive"
repository = "https://github.com/RKeelan/Seer"
license = "MIT"
publish = false

[features]
# Image generators, pixel comparison and other helpers for tests. Unit tests get
# it through `cfg(test)`, and integration tests through the dev-dependency below.
testutil = []

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
seer = { path = ".", features = ["testutil"] }

[build-dependencies]
embed-resource = "3.0.12"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
